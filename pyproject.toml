[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "danial-soupcheck-demo"
version = "0.1.0"
description = "A small CLI for learning to test Python releases."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
soupcheck = "soupcheck.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soupcheck = []
