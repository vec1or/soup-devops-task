name: Artifact Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt

      - name: Build distributions
        run: python -m build

      - name: Check the installed wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel in dist/"
            exit 1
          fi

          smoke_venv="$RUNNER_TEMP/soup-smoke-venv"
          smoke_work="$RUNNER_TEMP/soup-smoke-work"

          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --no-index --no-deps "${wheels[0]}"

          mkdir -p "$smoke_work"
          cd "$smoke_work"

          "$smoke_venv/bin/soupcheck" --version
          "$smoke_venv/bin/soupcheck" report
