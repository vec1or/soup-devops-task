name: Artifact Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Download repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt

      - name: Build distributions once
        run: python -m build

      - name: Upload distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  check:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.10", "3.12"]

    steps:
      - name: Download repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Download this run's distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: downloaded-dist
          digest-mismatch: error

      - name: Check the installed wheel
        run: python ci/smoke_wheel.py downloaded-dist

  lint:
    name: Lint and source tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install checking tools
        run: python -m pip install --no-cache-dir -r requirements-dev.txt -r requirements-lint.txt

      - name: Lint Python code
        run: python -m ruff check --no-cache src tests ci

      - name: Install project for source tests
        run: python -m pip install --no-build-isolation -e .

      - name: Run source tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker smoke test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download this run's distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/soupcheck-docker/dist
          digest-mismatch: error

      - name: Build Docker image from the downloaded wheel
        shell: bash
        run: |
          cp Dockerfile "$RUNNER_TEMP/soupcheck-docker/Dockerfile"
          docker build --no-cache -t soupcheck:ci "$RUNNER_TEMP/soupcheck-docker"

      - name: Check the container
        shell: bash
        run: |
          docker run --rm --network none soupcheck:ci --version
          docker run --rm --network none soupcheck:ci report
